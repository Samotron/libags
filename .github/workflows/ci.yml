name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DLIBAGS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config ${{ matrix.build_type }}

      - name: Install
        run: cmake --install build --prefix install --config ${{ matrix.build_type }}

      - name: Upload install tree
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.os }}
          path: install

  example-smoke:
    name: Example Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build library
        run: cmake -S . -B build -DLIBAGS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Compile DuckDB example
        run: cc -Iinclude -c examples/duckdb/duckdb_ingest_example.c -o build/duckdb_ingest_example.o
